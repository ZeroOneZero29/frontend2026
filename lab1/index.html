<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About me</title>

    <link rel="stylesheet" href="/nullstyles.css" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="about_me_container">
      <img class="my_photo" src="/src/img/photo-1.jpeg" alt="Моя фотография" />
      <section class="info_me">
        <p class="name paragraph">Илья Жигадлов</p>
        <p class="age paragraph">18 лет</p>
        <p class="group paragraph">группа ИВ-522</p>
      </section>
    </div>

    <div class="hobby_container">
      <p class="hobby_title">Мои увлечения</p>
      <div class="grid_container">
        <img src="/src/img/cooking.jpg" alt="" class="hobby_photo" />
        <img src="/src/img/network.jpg" alt="" class="hobby_photo" />
        <img src="/src/img/programming.jpg" alt="" class="hobby_photo" />
        <img src="/src/img/reading.jpg" alt="" class="hobby_photo" />
        <img src="/src/img/travel.jpg" alt="" class="hobby_photo" />
      </div>
    </div>

    <footer class="footer">
      <div class="footer_container">
        <div class="footer_logo">
          <span class="footer_logo_text">prod. by Zhigadlov</span>
        </div>
        <div class="git_container">
          <img class="github_logo" src="/src/img/github.svg" alt="GitHub" />
          <a
            href="https://github.com/ZeroOneZero29/frontend2026"
            target="_blank"
            rel="noopener noreferrer"
            class="footer_link paragraph"
          >
            GitHub
          </a>
        </div>
      </div>
    </footer>

</html>
